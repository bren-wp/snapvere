name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify release source
        run: python3 tools/verify_release.py .
      - name: Unit tests
        run: go test ./internal/...
      - name: Race tests
        run: go test -race ./internal/...
      - name: gofmt check
        run: test -z "$(gofmt -l cmd internal)"
      - name: go vet
        run: go vet ./internal/...

  windows-native-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build Windows x64 and ARM64 artifacts
        shell: pwsh
        run: ./tools/build_windows.ps1
      - name: Windows x64 headless runtime self-test
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          & ".\dist\Snapvera-$v-windows-x64-portable.exe" --self-test-headless
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package release artifacts
        shell: pwsh
        run: python tools/package_release.py artifacts
      - name: Verify PE security and installer payloads
        shell: pwsh
        run: python tools/verify_windows.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: snapvera-windows
          path: dist/
          if-no-files-found: error
