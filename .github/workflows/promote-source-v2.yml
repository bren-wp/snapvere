name: Verify and publish Snapvera 1.0.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-source-v2.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_TREE: 2ebdd6b93a51db197f625ab206b514af14ca7b36
  VERSION: 1.0.0

jobs:
  verify-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact clean source tree on main
        id: promote
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = @{
            message = 'Snapvera 1.0.0 verified production source'
            tree = '${{ env.SOURCE_TREE }}'
            parents = @('${{ github.sha }}')
          } | ConvertTo-Json -Compress
          $body | Set-Content -Path $env:RUNNER_TEMP\commit.json -Encoding utf8NoBOM
          $response = gh api --method POST "repos/${{ github.repository }}/git/commits" --input $env:RUNNER_TEMP\commit.json | ConvertFrom-Json
          if (-not $response.sha) { throw 'GitHub did not return the promoted commit SHA.' }
          $newSha = $response.sha
          $refBody = @{ sha = $newSha; force = $false } | ConvertTo-Json -Compress
          $refBody | Set-Content -Path $env:RUNNER_TEMP\ref.json -Encoding utf8NoBOM
          gh api --method PATCH "repos/${{ github.repository }}/git/refs/heads/main" --input $env:RUNNER_TEMP\ref.json | Out-Null
          "sha=$newSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Clean source commit: $newSha"

      - name: Checkout clean promoted source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.promote.outputs.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify release source
        shell: pwsh
        run: python tools/verify_release.py .

      - name: Unit tests
        shell: pwsh
        run: go test ./internal/...

      - name: gofmt quality gate
        shell: pwsh
        run: |
          $dirty = gofmt -l cmd internal
          if ($dirty) {
            Write-Host $dirty
            throw 'gofmt found unformatted Go files.'
          }

      - name: Build Windows x64 and ARM64
        shell: pwsh
        run: ./tools/build_windows.ps1

      - name: Native Windows x64 runtime self-test
        shell: pwsh
        run: ./bin/windows-x64/Snapvera.exe --self-test

      - name: Package release artifacts
        shell: pwsh
        run: python tools/package_release.py artifacts

      - name: Verify PE security and setup payloads
        shell: pwsh
        run: python tools/verify_windows.py dist

      - name: Verify SHA-256 manifest
        shell: pwsh
        run: |
          foreach ($line in Get-Content dist/SHA256SUMS.txt) {
            if (-not $line.Trim()) { continue }
            $parts = $line -split '\s{2,}', 2
            if ($parts.Count -ne 2) { throw "Malformed SHA256SUMS line: $line" }
            $path = Join-Path 'dist' $parts[1].Trim()
            if (-not (Test-Path $path)) { throw "Missing artifact: $path" }
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0].Trim().ToLowerInvariant()) { throw "SHA-256 mismatch: $path" }
          }

      - name: Create or move v1.0.0 tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = '${{ steps.promote.outputs.sha }}'
          $refBody = @{ sha = $sha; force = $true } | ConvertTo-Json -Compress
          $refBody | Set-Content -Path $env:RUNNER_TEMP\tagref.json -Encoding utf8NoBOM
          gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/v${{ env.VERSION }}" --input $env:RUNNER_TEMP\tagref.json 2>$null
          if ($LASTEXITCODE -ne 0) {
            $createBody = @{ ref = "refs/tags/v${{ env.VERSION }}"; sha = $sha } | ConvertTo-Json -Compress
            $createBody | Set-Content -Path $env:RUNNER_TEMP\tagcreate.json -Encoding utf8NoBOM
            gh api --method POST "repos/${{ github.repository }}/git/refs" --input $env:RUNNER_TEMP\tagcreate.json | Out-Null
          }

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            'dist/Snapvera-Setup.exe',
            'dist/Snapvera-Portable.exe',
            'dist/Snapvera-Source.zip',
            'dist/Snapvera-1.0.0-windows-x64-setup.exe',
            'dist/Snapvera-1.0.0-windows-x64-portable.exe',
            'dist/Snapvera-1.0.0-windows-x64.exe',
            'dist/Snapvera-1.0.0-windows-x64-uninstall.exe',
            'dist/Snapvera-1.0.0-windows-x64-portable.zip',
            'dist/Snapvera-1.0.0-windows-arm64-setup.exe',
            'dist/Snapvera-1.0.0-windows-arm64-portable.exe',
            'dist/Snapvera-1.0.0-windows-arm64.exe',
            'dist/Snapvera-1.0.0-windows-arm64-uninstall.exe',
            'dist/Snapvera-1.0.0-windows-arm64-portable.zip',
            'dist/Snapvera-1.0.0-source.zip',
            'dist/Snapvera-1.0.0-icons.zip',
            'dist/Snapvera-1.0.0-DELIVERY.zip',
            'dist/SHA256SUMS.txt',
            'dist/SOURCE-MANIFEST-SHA256.txt'
          )
          gh release view "v${{ env.VERSION }}" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v${{ env.VERSION }}" @assets --clobber
          } else {
            gh release create "v${{ env.VERSION }}" @assets --title "Snapvera ${{ env.VERSION }}" --notes-file RELEASE_NOTES.md --target '${{ steps.promote.outputs.sha }}'
          }
