name: Promote Snapvera 1.0.0 source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-source.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_TREE: 2ebdd6b93a51db197f625ab206b514af14ca7b36
  VERSION: 1.0.0

jobs:
  promote-verify-release:
    runs-on: windows-latest
    steps:
      - name: Checkout bootstrap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote exact verified source tree
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = @{
            message = 'Snapvera 1.0.0 production source'
            tree = '${{ env.SOURCE_TREE }}'
            parents = @('${{ github.sha }}')
          } | ConvertTo-Json -Compress
          $response = gh api --method POST "repos/${{ github.repository }}/git/commits" --input - <<< $body | ConvertFrom-Json
          $newSha = $response.sha
          if (-not $newSha) { throw 'GitHub did not return the promoted commit SHA.' }
          $refBody = @{ sha = $newSha; force = $false } | ConvertTo-Json -Compress
          gh api --method PATCH "repos/${{ github.repository }}/git/refs/heads/main" --input - <<< $refBody | Out-Null
          "PROMOTED_SHA=$newSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Promoted source commit: $newSha"

      - name: Checkout promoted source
        shell: pwsh
        run: |
          git fetch origin main --tags --force
          git checkout --force $env:PROMOTED_SHA
          git clean -ffd

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify source catalog and release metadata
        shell: pwsh
        run: python tools/verify_release.py .

      - name: Unit tests
        shell: pwsh
        run: go test ./internal/...

      - name: gofmt quality gate
        shell: pwsh
        run: |
          $dirty = gofmt -l cmd internal
          if ($dirty) {
            Write-Host $dirty
            throw 'gofmt found unformatted Go files.'
          }

      - name: Build Windows x64 and ARM64
        shell: pwsh
        run: ./tools/build_windows.ps1

      - name: Native Windows x64 runtime self-test
        shell: pwsh
        run: ./bin/windows-x64/Snapvera.exe --self-test

      - name: Package release artifacts
        shell: pwsh
        run: python tools/package_release.py artifacts

      - name: Verify Windows PE files and embedded setup payloads
        shell: pwsh
        run: python tools/verify_windows.py dist

      - name: Verify SHA-256 manifest
        shell: pwsh
        run: |
          $lines = Get-Content dist/SHA256SUMS.txt
          foreach ($line in $lines) {
            if (-not $line.Trim()) { continue }
            $parts = $line -split '\s{2,}', 2
            if ($parts.Count -ne 2) { throw "Malformed SHA256SUMS line: $line" }
            $expected = $parts[0].Trim().ToLowerInvariant()
            $path = Join-Path 'dist' $parts[1].Trim()
            if (-not (Test-Path $path)) { throw "Missing artifact: $path" }
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA-256 mismatch: $path" }
          }

      - name: Create v1.0.0 tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh api "repos/${{ github.repository }}/git/ref/tags/v${{ env.VERSION }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag v${{ env.VERSION }} already exists."
          } else {
            $body = @{ ref = "refs/tags/v${{ env.VERSION }}"; sha = $env:PROMOTED_SHA } | ConvertTo-Json -Compress
            gh api --method POST "repos/${{ github.repository }}/git/refs" --input - <<< $body | Out-Null
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            'dist/Snapvera-Setup.exe',
            'dist/Snapvera-Portable.exe',
            'dist/Snapvera-Source.zip',
            'dist/Snapvera-1.0.0-windows-x64-setup.exe',
            'dist/Snapvera-1.0.0-windows-x64-portable.exe',
            'dist/Snapvera-1.0.0-windows-x64.exe',
            'dist/Snapvera-1.0.0-windows-x64-uninstall.exe',
            'dist/Snapvera-1.0.0-windows-x64-portable.zip',
            'dist/Snapvera-1.0.0-windows-arm64-setup.exe',
            'dist/Snapvera-1.0.0-windows-arm64-portable.exe',
            'dist/Snapvera-1.0.0-windows-arm64.exe',
            'dist/Snapvera-1.0.0-windows-arm64-uninstall.exe',
            'dist/Snapvera-1.0.0-windows-arm64-portable.zip',
            'dist/Snapvera-1.0.0-source.zip',
            'dist/Snapvera-1.0.0-icons.zip',
            'dist/Snapvera-1.0.0-DELIVERY.zip',
            'dist/SHA256SUMS.txt',
            'dist/SOURCE-MANIFEST-SHA256.txt'
          )
          $existing = gh release view "v${{ env.VERSION }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v${{ env.VERSION }}" @assets --clobber
          } else {
            gh release create "v${{ env.VERSION }}" @assets --title "Snapvera ${{ env.VERSION }}" --notes-file RELEASE_NOTES.md --target $env:PROMOTED_SHA
          }
