# Final one-time dispatcher for Snapvera 1.0.0 after complete source/tools import.
name: One-time v1.0.0 release dispatcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-trigger.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "${{ github.repository }}" --ref main
