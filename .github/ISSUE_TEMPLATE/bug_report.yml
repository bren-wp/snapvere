name: Bug report
description: Report a reproducible Snapvera problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Snapvera version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Windows architecture
      options: [x64, ARM64]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe exactly what you clicked or pressed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Attach or paste the relevant lines from snapvera.log. Remove private data first.
