# Publish hardened Snapvera 1.0.0 source with a CI-safe headless runtime test.
name: Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapvera-release-v1.0.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $v" }
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify release source
        shell: pwsh
        run: python tools/verify_release.py .

      - name: Unit tests
        shell: pwsh
        run: go test ./internal/...

      - name: gofmt quality gate
        shell: pwsh
        run: |
          $dirty = gofmt -l cmd internal
          if ($dirty) {
            Write-Host $dirty
            throw 'gofmt found unformatted Go files.'
          }

      - name: go vet quality gate
        shell: pwsh
        run: go vet ./internal/...

      - name: Build Windows x64 and ARM64
        shell: pwsh
        run: ./tools/build_windows.ps1

      - name: Native Windows x64 headless runtime self-test
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.value }}'
          & ".\dist\Snapvera-$v-windows-x64-portable.exe" --self-test-headless
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package release artifacts
        shell: pwsh
        run: python tools/package_release.py artifacts

      - name: Verify PE security and installer payloads
        shell: pwsh
        run: python tools/verify_windows.py dist

      - name: Verify SHA-256 manifest
        shell: pwsh
        run: |
          foreach ($line in Get-Content dist/SHA256SUMS.txt) {
            if (-not $line.Trim()) { continue }
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Malformed SHA256SUMS line: $line" }
            $path = Join-Path 'dist' $Matches[2]
            if (-not (Test-Path $path)) { throw "Missing artifact: $path" }
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1].ToLowerInvariant()) { throw "SHA-256 mismatch: $path" }
          }

      - name: Create or update version tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.value }}'
          $tag = "v$v"
          $sha = '${{ github.sha }}'
          gh api "repos/${{ github.repository }}/git/ref/tags/$tag" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/$tag" -f sha="$sha" -F force=true | Out-Null
          } else {
            gh api --method POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" | Out-Null
          }

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.value }}'
          $tag = "v$v"
          $assets = @(
            'dist/Snapvera-Setup.exe',
            'dist/Snapvera-Portable.exe',
            'dist/Snapvera-Source.zip',
            "dist/Snapvera-$v-windows-x64.exe",
            "dist/Snapvera-$v-windows-x64-setup.exe",
            "dist/Snapvera-$v-windows-x64-portable.exe",
            "dist/Snapvera-$v-windows-x64-uninstall.exe",
            "dist/Snapvera-$v-windows-x64-portable.zip",
            "dist/Snapvera-$v-windows-arm64.exe",
            "dist/Snapvera-$v-windows-arm64-setup.exe",
            "dist/Snapvera-$v-windows-arm64-portable.exe",
            "dist/Snapvera-$v-windows-arm64-uninstall.exe",
            "dist/Snapvera-$v-windows-arm64-portable.zip",
            "dist/Snapvera-$v-source.zip",
            "dist/Snapvera-$v-icons.zip",
            "dist/Snapvera-$v-DELIVERY.zip",
            'dist/SHA256SUMS.txt',
            'dist/SOURCE-MANIFEST-SHA256.txt'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Missing release asset: $asset" }
          }
          gh release view "$tag" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release edit "$tag" --title "Snapvera v$v" --notes-file RELEASE_NOTES.md
            gh release upload "$tag" @assets --clobber
          } else {
            gh release create "$tag" @assets --title "Snapvera v$v" --notes-file RELEASE_NOTES.md --target '${{ github.sha }}'
          }
